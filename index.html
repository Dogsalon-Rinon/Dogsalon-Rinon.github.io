<title>Rinon | Dog Trimming Salon - Coming Soon</title>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@400;500;600&family=Zen+Maru+Gothic:wght@400;500&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: linear-gradient(135deg, #D6EEFA 0%, #EEF8FF 50%, #E0F0FA 100%);
  font-family: 'Quicksand', sans-serif;
  min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
  padding: 40px 20px;
}
.wrap { max-width: 560px; width: 100%; text-align: center; }
.dog-photo {
  width: 100px; height: 100px; border-radius: 50%;
  overflow: hidden; margin: 0 auto 24px;
  border: 3px solid #B3D9F5;
}
.dog-photo img { width: 100%; height: 100%; object-fit: cover; }
.logo { font-family: 'Pacifico', cursive; font-size: 68px; color: #1A6FA8; line-height: 1; }
.logo span { color: #5DBAEC; }
.logo-sub { font-size: 12px; color: #7AAAC0; letter-spacing: 0.3em; margin-top: 6px; margin-bottom: 28px; }
.badge {
  display: inline-block; background: #5DBAEC; color: white;
  font-size: 11px; font-weight: 600; padding: 6px 20px;
  border-radius: 20px; letter-spacing: 0.2em; margin-bottom: 20px;
}
.open-date { font-family: 'Zen Maru Gothic', sans-serif; font-size: 26px; font-weight: 500; color: #1A6FA8; margin-bottom: 10px; }
.desc { font-size: 13px; color: #5A8FAA; line-height: 1.9; margin-bottom: 36px; }
.countdown { display: grid; grid-template-columns: repeat(4,1fr); gap: 10px; margin-bottom: 36px; }
.cd-item { background: white; border: 0.5px solid #B3D9F5; border-radius: 14px; padding: 14px 8px; }
.cd-num { font-family: 'Pacifico', cursive; font-size: 32px; color: #1A6FA8; line-height: 1; margin-bottom: 4px; }
.cd-label { font-size: 10px; color: #7AAAC0; letter-spacing: 0.12em; }
.info-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; margin-bottom: 36px; }
.info-card { background: white; border: 0.5px solid #B3D9F5; border-radius: 14px; padding: 16px 10px; }
.info-label { font-size: 10px; color: #7AAAC0; letter-spacing: 0.1em; margin-bottom: 6px; }
.info-val { font-family: 'Zen Maru Gothic', sans-serif; font-size: 12px; color: #0C447C; line-height: 1.6; }
.sns-label { font-size: 12px; color: #7AAAC0; margin-bottom: 14px; }
.sns-wrap { display: flex; justify-content: center; gap: 12px; margin-bottom: 20px; }
.btn-insta {
  display: inline-flex; align-items: center; gap: 8px;
  background: #E8F6FE; color: #0C447C;
  border: 1px solid #B3D9F5;
  font-size: 13px; font-weight: 600;
  padding: 11px 24px; border-radius: 30px;
  text-decoration: none; font-family: 'Quicksand', sans-serif;
}
.btn-tiktok {
  display: inline-flex; align-items: center; gap: 8px;
  background: #1A6FA8; color: white;
  border: none;
  font-size: 13px; font-weight: 600;
  padding: 11px 24px; border-radius: 30px;
  text-decoration: none; font-family: 'Quicksand', sans-serif;
}
.hp-link { font-size: 12px; color: #7AAAC0; text-decoration: none; display: block; margin-top: 8px; }
.hp-link:hover { color: #1A6FA8; }
.footer { font-size: 11px; color: #A0C8E0; margin-top: 40px; }
</style>

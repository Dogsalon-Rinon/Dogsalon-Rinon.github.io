<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rinon カルテ管理</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Helvetica Neue', Arial, sans-serif; background: #F0F7FF; color: #0C447C; min-height: 100vh; }

.header { background: #0C447C; padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
.header-logo { font-size: 22px; font-weight: 700; color: white; letter-spacing: 0.05em; }
.header-logo span { color: #5DBAEC; }
.header-sub { font-size: 11px; color: #B3D9F5; margin-top: 2px; }
.header-right { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.btn { padding: 8px 16px; border-radius: 20px; border: none; font-size: 12px; font-weight: 600; cursor: pointer; transition: opacity 0.2s; }
.btn:hover { opacity: 0.85; }
.btn-primary { background: #1A6FA8; color: white; }
.btn-light { background: #E8F4FC; color: #1A6FA8; }
.btn-green { background: #2EA87E; color: white; }
.btn-sm { padding: 5px 12px; font-size: 11px; }

.main { display: grid; grid-template-columns: 320px 1fr; min-height: calc(100vh - 60px); }

.sidebar { background: white; border-right: 1px solid #D0E8F8; overflow-y: auto; }
.sidebar-header { padding: 16px; border-bottom: 1px solid #E8F4FC; }
.sidebar-header h2 { font-size: 13px; font-weight: 700; color: #0C447C; margin-bottom: 10px; }
.search-box { width: 100%; padding: 8px 12px; border: 1px solid #B3D9F5; border-radius: 20px; font-size: 12px; color: #0C447C; outline: none; }
.search-box:focus { border-color: #1A6FA8; }
.stats { display: flex; gap: 8px; margin-top: 10px; }
.stat { background: #F0F7FF; border-radius: 8px; padding: 6px 10px; flex: 1; text-align: center; }
.stat-num { font-size: 18px; font-weight: 700; color: #1A6FA8; }
.stat-label { font-size: 10px; color: #7AAAC0; }

.customer-list { padding: 8px; }
.customer-card { padding: 12px; border-radius: 10px; cursor: pointer; margin-bottom: 4px; border: 1.5px solid transparent; transition: all 0.15s; }
.customer-card:hover { background: #F0F7FF; }
.customer-card.active { background: #E8F4FC; border-color: #1A6FA8; }
.customer-name { font-size: 13px; font-weight: 700; color: #0C447C; }
.customer-dog { font-size: 12px; color: #1A6FA8; margin-top: 2px; }
.customer-dog span { background: #E8F4FC; border-radius: 4px; padding: 1px 6px; font-size: 11px; }
.customer-meta { font-size: 11px; color: #7AAAC0; margin-top: 4px; display:flex; justify-content:space-between; align-items:center;}
.visit-badge { background: #5DBAEC; color: white; border-radius: 10px; padding: 1px 8px; font-size: 10px; font-weight:700; }
.empty-list { text-align: center; padding: 40px 20px; color: #7AAAC0; font-size: 12px; }

.content { padding: 24px; overflow-y: auto; }
.welcome { text-align: center; padding: 80px 40px; color: #7AAAC0; }
.welcome-icon { font-size: 48px; margin-bottom: 16px; }
.welcome h2 { font-size: 18px; color: #1A6FA8; margin-bottom: 8px; }
.welcome p { font-size: 13px; line-height: 1.8; }

.karte-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 20px; flex-wrap: wrap; gap: 8px; }
.karte-header-main { display: flex; align-items: center; gap: 14px; }
.karte-title { font-size: 20px; font-weight: 700; color: #0C447C; }
.karte-title span { color: #5DBAEC; }
.karte-date { font-size: 12px; color: #7AAAC0; margin-top: 4px; }

.dog-photo-box { position: relative; width: 72px; height: 72px; flex-shrink: 0; }
.dog-photo-img { width: 72px; height: 72px; border-radius: 14px; object-fit: cover; cursor: pointer; border: 2px solid #E0F0FB; display: block; }
.dog-photo-placeholder { width: 72px; height: 72px; border-radius: 14px; background: #E8F4FC; display: flex; align-items: center; justify-content: center; font-size: 28px; border: 2px dashed #B3D9F5; }
.dog-photo-actions { display: flex; gap: 4px; margin-top: 4px; justify-content: center; }
.dog-photo-upload { font-size: 10px; background: #1A6FA8; color: white; border-radius: 10px; padding: 3px 8px; cursor: pointer; font-weight: 600; }
.dog-photo-delete { font-size: 10px; background: #FFE8E8; color: #C06060; border-radius: 10px; padding: 3px 8px; cursor: pointer; font-weight: 600; }

.visit-photos { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.visit-photo-thumb { position: relative; width: 64px; height: 64px; }
.visit-photo-thumb img { width: 64px; height: 64px; border-radius: 8px; object-fit: cover; cursor: pointer; border: 1.5px solid #E0F0FB; display: block; }
.visit-photo-del { position: absolute; top: -6px; right: -6px; background: #C06060; color: white; width: 18px; height: 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; cursor: pointer; font-weight: 700; }
.visit-photo-add { width: 64px; height: 64px; border-radius: 8px; border: 1.5px dashed #B3D9F5; display: flex; align-items: center; justify-content: center; font-size: 10px; color: #1A6FA8; text-align: center; cursor: pointer; line-height: 1.3; padding: 2px; }

.section { background: white; border-radius: 12px; padding: 20px; margin-bottom: 16px; border: 1px solid #E0F0FB; }
.section-title { font-size: 12px; font-weight: 700; color: #1A6FA8; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 14px; padding-bottom: 8px; border-bottom: 1px solid #E8F4FC; display:flex; justify-content:space-between; align-items:center;}
.info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.info-item { }
.info-label { font-size: 10px; font-weight: 600; color: #7AAAC0; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 3px; }
.info-value { font-size: 13px; color: #0C447C; font-weight: 500; }
.info-value.large { grid-column: 1 / -1; }

.memo-box { width: 100%; padding: 12px; border: 1.5px solid #B3D9F5; border-radius: 8px; font-size: 13px; color: #0C447C; resize: vertical; min-height: 80px; font-family: inherit; outline: none; }
.memo-box:focus { border-color: #1A6FA8; }
.memo-saved { font-size: 11px; color: #2EA87E; margin-top: 6px; display: none; }

.loading { text-align: center; padding: 40px; color: #7AAAC0; font-size: 13px; }
.spinner { width: 32px; height: 32px; border: 3px solid #E8F4FC; border-top-color: #1A6FA8; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 12px; }
@keyframes spin { to { transform: rotate(360deg); } }

.tag { display: inline-block; background: #E8F4FC; color: #1A6FA8; border-radius: 12px; padding: 3px 10px; font-size: 11px; font-weight: 600; }
.tag-red { background: #FFE8E8; color: #C06060; }

/* 来店履歴タイムライン */
.visit-item { border-left: 3px solid #B3D9F5; padding: 10px 16px; margin-bottom: 4px; position: relative; }
.visit-item.first { border-left-color: #1A6FA8; }
.visit-item::before { content:''; position:absolute; left:-6px; top:14px; width:9px; height:9px; border-radius:50%; background:#B3D9F5; }
.visit-item.first::before { background:#1A6FA8; }
.visit-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:4px; }
.visit-date { font-size: 12px; font-weight: 700; color: #0C447C; }
.visit-type { font-size: 10px; padding: 2px 8px; border-radius: 10px; font-weight:700; }
.visit-type.first-type { background:#E8F4FC; color:#1A6FA8; }
.visit-type.repeat-type { background:#F0F8E8; color:#5A9050; }
.visit-detail { font-size: 12px; color: #1A6FA8; }
.visit-actions { margin-top: 8px; display: flex; gap: 8px; flex-wrap: wrap; }
.visit-memo { font-size: 11px; color: #7AAAC0; margin-top: 4px; font-style: italic; }

.back-to-list { display: none; }

@media (max-width: 768px) {
  .main { grid-template-columns: 1fr; }

  .content { padding: 16px 12px; }
  .karte-header { flex-direction: column; align-items: stretch; }
  .karte-title { font-size: 17px; }

  .section { padding: 14px; }
  .info-grid { grid-template-columns: 1fr; gap: 12px; }

  .visit-item { padding: 12px 14px; margin-bottom: 14px; border-radius: 8px; background: #FAFDFF; border-left-width: 4px; }
  .visit-header { flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .visit-date { font-size: 14px; font-weight: 700; }
  .visit-type { font-size: 11px; padding: 3px 10px; }
  .visit-detail { font-size: 13px; line-height: 1.9; }
  .visit-actions { flex-direction: column; }
  .visit-actions .btn { width: 100%; padding: 10px 14px; font-size: 12px; }

  .main.sidebar-collapsed .sidebar { display: none; }
  .main.sidebar-collapsed .back-to-list {
    display: inline-flex; align-items: center; gap: 6px;
    margin-bottom: 14px; padding: 8px 16px;
  }

  .welcome { padding: 40px 24px; }
}
</style>
</head>
<body>

<div class="header">
  <div>
    <div class="header-logo">Ri<span>n</span>on <span style="font-size:13px; font-weight:400; color:#B3D9F5;">カルテ管理</span></div>
    <div class="header-sub">Dog Trimming Salon</div>
  </div>
  <div class="header-right">
    <button class="btn btn-light" onclick="loadData()">🔄 データ更新</button>
    <button class="btn btn-green" onclick="exportExcel()">📊 Excelエクスポート</button>
  </div>
</div>

<div class="main">
  <div class="sidebar">
    <div class="sidebar-header">
      <h2>顧客一覧</h2>
      <input class="search-box" type="text" id="searchBox" placeholder="名前・犬種で検索..." oninput="filterCustomers()">
      <div class="stats">
        <div class="stat"><div class="stat-num" id="totalCount">-</div><div class="stat-label">登録頭数</div></div>
        <div class="stat"><div class="stat-num" id="totalVisits">-</div><div class="stat-label">来店総数</div></div>
      </div>
      <button class="btn btn-primary btn-sm" style="width:100%; margin-top:10px;" onclick="openPhoneReserve()">📞 電話予約を入力</button>
    </div>
    <div class="customer-list" id="customerList">
      <div class="loading"><div class="spinner"></div>データを読み込み中...</div>
    </div>
    <div style="padding:10px 16px; border-top:1px solid #E8F4FC;">
      <button class="btn btn-light btn-sm" style="width:100%;" onclick="showHiddenManager()">🗑 削除したカルテを管理</button>
    </div>
    <div style="padding:10px 16px; border-top:1px solid #E8F4FC;">
      <div style="font-size:11px; color:#7AAAC0; margin-bottom:6px; text-align:center;">📅 カレンダー登録</div>
      <div style="display:flex; gap:6px; margin-bottom:8px;">
        <button id="mode-single" onclick="setMode('single')" style="flex:1; padding:5px; background:#1A6FA8; color:white; border:none; border-radius:8px; font-size:11px; cursor:pointer;">単日</button>
        <button id="mode-range" onclick="setMode('range')" style="flex:1; padding:5px; background:#E8F6FE; color:#1A6FA8; border:1px solid #B3D9F5; border-radius:8px; font-size:11px; cursor:pointer;">期間</button>
      </div>
      <input type="date" id="statusDate" style="width:100%; padding:6px 8px; border:1px solid #B3D9F5; border-radius:8px; font-size:12px; color:#0C447C; box-sizing:border-box; margin-bottom:4px;">
      <div id="endDateWrap" style="display:none;">
        <div style="font-size:10px; color:#7AAAC0; text-align:center; margin:2px 0;">〜</div>
        <input type="date" id="statusEndDate" style="width:100%; padding:6px 8px; border:1px solid #B3D9F5; border-radius:8px; font-size:12px; color:#0C447C; box-sizing:border-box; margin-bottom:4px;">
      </div>
      <div style="display:flex; gap:6px; margin-top:4px;">
        <button onclick="setCalStatus('満員')" style="flex:1; padding:6px; background:#FEE2E2; color:#B91C1C; border:1px solid #FECACA; border-radius:8px; font-size:12px; cursor:pointer;">満員</button>
        <button onclick="setCalStatus('休業')" style="flex:1; padding:6px; background:#F1F5F9; color:#64748B; border:1px solid #CBD5E1; border-radius:8px; font-size:12px; cursor:pointer;">休業</button>
        <button onclick="setCalStatus('解除')" style="flex:1; padding:6px; background:#E8F6FE; color:#0C447C; border:1px solid #B3D9F5; border-radius:8px; font-size:12px; cursor:pointer;">解除</button>
      </div>
    </div>
  </div>

  <div class="content" id="content">
    <div class="welcome">
      <div class="welcome-icon">🐾</div>
      <h2>カルテを選択してください</h2>
      <p>左の顧客一覧から名前をクリックすると<br>カルテ詳細と来店履歴が表示されます</p>
    </div>
  </div>
</div>

<script>
const FIRST_SHEET_ID = '19vWELviHaLORivnobZ88UVwa1StIOrEbWYQRFdV5Aiw';
const REPEAT_SHEET_ID = '1MhHHNizbxfwcIf1-ABSqkmn8wCWFwtzAv6FwFJYxEMU';

const FIRST_SHEET_NAME = 'フォームの回答1';
const REPEAT_SHEET_NAME = 'フォームの回答1';

let customers = []; // 顧客単位（飼い主名+犬名でグループ化）
let firstDataRaw = null;
let repeatDataRaw = null;

// ── 写真機能（Googleドライブ保存） ──
function driveThumbUrl(fileId, size) {
  return 'https://drive.google.com/thumbnail?id=' + fileId + '&sz=w' + (size || 200);
}
function driveViewUrl(fileId) {
  return 'https://drive.google.com/file/d/' + fileId + '/view';
}

// 顧客の「プロフィール更新先」（初回シートの行か、初回データが無ければリピートシートの最古の行）を判定
function profileTarget(c) {
  if (c.firstRowNum) return { url: FIRST_API_URL, row: c.firstRowNum };
  var v = c.visits.find(function(v) { return v.type === 'first'; }) || c.visits[0];
  if (!v) return null;
  return { url: v.type === 'first' ? FIRST_API_URL : REPEAT_API_URL, row: v.rowNum };
}

// 画像をリサイズ・圧縮してbase64(dataURLの本体部分)を返す
function resizeImageFile(file, maxSize, quality) {
  return new Promise(function(resolve, reject) {
    var reader = new FileReader();
    reader.onerror = function() { reject(new Error('読み込みに失敗しました')); };
    reader.onload = function() {
      var img = new Image();
      img.onerror = function() { reject(new Error('画像の読み込みに失敗しました')); };
      img.onload = function() {
        var w = img.width, h = img.height;
        var scale = Math.min(1, maxSize / Math.max(w, h));
        var cw = Math.round(w * scale), ch = Math.round(h * scale);
        var canvas = document.createElement('canvas');
        canvas.width = cw; canvas.height = ch;
        canvas.getContext('2d').drawImage(img, 0, 0, cw, ch);
        var dataUrl = canvas.toDataURL('image/jpeg', quality || 0.8);
        resolve(dataUrl.split(',')[1]);
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function uploadProfilePhoto(idx, inputEl) {
  var file = inputEl.files && inputEl.files[0];
  if (!file) return;
  var c = customers[idx];
  var target = profileTarget(c);
  if (!target) { alert('この顧客の登録情報が見つからないため、写真を保存できません'); return; }
  var box = document.getElementById('dog-photo-box-' + idx);
  if (box) box.style.opacity = '0.5';

  resizeImageFile(file, 1000, 0.8).then(function(base64) {
    var params = new URLSearchParams();
    params.set('action', 'uploadPhoto');
    params.set('secret', DELETE_SECRET);
    params.set('target', 'profile');
    params.set('row', target.row);
    params.set('image', base64);
    params.set('mimeType', 'image/jpeg');
    return fetch(target.url, { method: 'POST', body: params });
  }).then(function(r) { return r.json(); }).then(function(res) {
    if (!res || !res.success) { alert('アップロードに失敗しました：' + (res && res.error ? res.error : '不明なエラー')); if (box) box.style.opacity = '1'; return; }
    c.dogPhotoId = res.fileId;
    c.profile['犬の写真'] = res.fileId;
    showKarte(idx);
  }).catch(function() {
    alert('通信エラーが発生しました');
    if (box) box.style.opacity = '1';
  });
}

function deleteProfilePhoto(idx) {
  var c = customers[idx];
  if (!c.dogPhotoId) return;
  if (!confirm('この写真を削除しますか？')) return;
  var target = profileTarget(c);
  if (!target) return;
  var box = document.getElementById('dog-photo-box-' + idx);
  if (box) box.style.opacity = '0.5';

  var params = new URLSearchParams();
  params.set('action', 'deletePhoto');
  params.set('secret', DELETE_SECRET);
  params.set('target', 'profile');
  params.set('row', target.row);
  params.set('fileId', c.dogPhotoId);
  fetch(target.url, { method: 'POST', body: params }).then(function(r) { return r.json(); }).then(function(res) {
    if (!res || !res.success) { alert('削除に失敗しました：' + (res && res.error ? res.error : '不明なエラー')); if (box) box.style.opacity = '1'; return; }
    c.dogPhotoId = '';
    c.profile['犬の写真'] = '';
    showKarte(idx);
  }).catch(function() {
    alert('通信エラーが発生しました');
    if (box) box.style.opacity = '1';
  });
}

function uploadVisitPhoto(uid, inputEl) {
  var files = inputEl.files ? Array.prototype.slice.call(inputEl.files) : [];
  if (files.length === 0) return;
  var info = visitLookup[uid];
  if (!info || !info.rowNum) { alert('この来店の行情報が見つからないため、写真を保存できません'); return; }
  var apiUrl = info.type === 'first' ? FIRST_API_URL : REPEAT_API_URL;
  var container = document.getElementById('visit-photos-' + uid);
  if (container) container.style.opacity = '0.5';

  var failCount = 0;

  function uploadOne(file) {
    return resizeImageFile(file, 1200, 0.8).then(function(base64) {
      var params = new URLSearchParams();
      params.set('action', 'uploadPhoto');
      params.set('secret', DELETE_SECRET);
      params.set('target', 'visit');
      params.set('row', info.rowNum);
      params.set('image', base64);
      params.set('mimeType', 'image/jpeg');
      return fetch(apiUrl, { method: 'POST', body: params });
    }).then(function(r) { return r.json(); }).then(function(res) {
      if (!res || !res.success) { failCount++; return; }
      if (!info.visitObj.photos) info.visitObj.photos = [];
      info.visitObj.photos.push(res.fileId);
    }).catch(function() { failCount++; });
  }

  // 1枚ずつ順番にアップロード（同時送信すると行の書き込みが競合するため）
  files.reduce(function(chain, file) {
    return chain.then(function() { return uploadOne(file); });
  }, Promise.resolve()).then(function() {
    if (failCount > 0) alert(files.length + '枚中 ' + failCount + '枚のアップロードに失敗しました');
    showKarte(info.customerIdx);
  });
}

function deleteVisitPhoto(uid, fileId) {
  if (!confirm('この写真を削除しますか？')) return;
  var info = visitLookup[uid];
  if (!info || !info.rowNum) return;
  var apiUrl = info.type === 'first' ? FIRST_API_URL : REPEAT_API_URL;
  var container = document.getElementById('visit-photos-' + uid);
  if (container) container.style.opacity = '0.5';

  var params = new URLSearchParams();
  params.set('action', 'deletePhoto');
  params.set('secret', DELETE_SECRET);
  params.set('target', 'visit');
  params.set('row', info.rowNum);
  params.set('fileId', fileId);
  fetch(apiUrl, { method: 'POST', body: params }).then(function(r) { return r.json(); }).then(function(res) {
    if (!res || !res.success) { alert('削除に失敗しました：' + (res && res.error ? res.error : '不明なエラー')); if (container) container.style.opacity = '1'; return; }
    info.visitObj.photos = (info.visitObj.photos || []).filter(function(id) { return id !== fileId; });
    showKarte(info.customerIdx);
  }).catch(function() {
    alert('通信エラーが発生しました');
    if (container) container.style.opacity = '1';
  });
}

function saveAddressToSheet(rowNum, val, el) {
  fetch(FIRST_API_URL + '?action=saveAddress&row=' + rowNum + '&secret=' + DELETE_SECRET + '&value=' + encodeURIComponent(val))
    .then(function(res){ return res.json(); })
    .then(function(data){
      if (data && data.success) {
        el.style.borderColor = '#2EA87E';
        setTimeout(function() { el.style.borderColor = '#B3D9F5'; }, 1000);
      } else {
        alert('保存に失敗しました: ' + (data && data.error ? data.error : '不明なエラー'));
      }
    })
    .catch(function(){ alert('保存に失敗しました（通信エラー）'); });
}

var visitLookup = {}; // uid -> {key, owner, dog, breed, menu, date}
function issueReceipt(uid) {
  var info = visitLookup[uid];
  if (!info) return;
  var params = new URLSearchParams({
    owner: info.owner || '',
    dog: info.dog || '',
    breed: info.breed || '',
    menu: info.menu || '',
    date: info.date || ''
  });
  window.open('receipt.html?' + params.toString(), '_blank');
}

function notifyComplete(uid) {
  var info = visitLookup[uid];
  if (!info) return;

  if (!info.email) {
    alert(info.owner + '様はメールアドレス未登録のため、通知を送信できません。\n口頭またはお電話でお知らせください。');
    return;
  }
  if (!confirm(info.dog + 'ちゃんの完了通知を ' + info.email + ' 宛に送信しますか？')) return;

  var apiUrl = info.type === 'first' ? FIRST_API_URL : REPEAT_API_URL;
  var params = new URLSearchParams({
    action: 'complete',
    row: info.rowNum,
    secret: DELETE_SECRET,
    email: info.email,
    dog: info.dog
  });
  fetch(apiUrl + '?' + params.toString())
    .then(function(res){ return res.json(); })

function fetchCsv(url) {
  return fetch(url, { cache: 'no-store' }).then(function(res) {
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return res.text();
  }).then(function(text) {
    return parseCsv(text);
  });
}

// CSVパーサー（カンマ・改行・引用符対応）
function parseCsv(text) {
  var rows = [];
  var row = [];
  var field = '';
  var inQuotes = false;
  for (var i = 0; i < text.length; i++) {
    var c = text[i];
    if (inQuotes) {
      if (c === '"') {
        if (text[i+1] === '"') { field += '"'; i++; }
        else { inQuotes = false; }
      } else { field += c; }
    } else {
      if (c === '"') { inQuotes = true; }
      else if (c === ',') { row.push(field); field = ''; }
      else if (c === '\n' || c === '\r') {
        if (c === '\r' && text[i+1] === '\n') i++;
        row.push(field); field = '';
        if (row.length > 1 || row[0] !== '') rows.push(row);
        row = [];
      } else { field += c; }
    }
  }
  if (field !== '' || row.length > 0) { row.push(field); rows.push(row); }

  if (rows.length === 0) return [];
  var headers = rows[0].map(function(h) { return h.trim(); });
  return rows.slice(1).map(function(r, i) {
    var obj = {};
    headers.forEach(function(h, j) { obj[h] = (r[j] || '').trim(); });
    obj['__rowNum'] = i + 2; // 1行目がヘッダーなのでデータは2行目から
    return obj;
  }).filter(function(r) {
    return r['飼い主さまのお名前'] || r['飼い主様のお名前'];
  });
}

function tryRender() {

  buildCustomers();

function customerKey(owner, dog) {
  return (owner || '').trim() + '___' + (dog || '').trim();
}

function buildCustomers() {
  var map = {};

  // 初回データから顧客を作成
  firstDataRaw.forEach(function(r) {
    var owner = r['飼い主さまのお名前'];
    var dog = r['ワンちゃんのお名前'];
    var key = customerKey(owner, dog);
    if (!map[key]) {
      map[key] = {
        owner: owner, dog: dog,
        profile: r,
        firstRowNum: r['__rowNum'],
        visits: []
      };
    } else {
      map[key].profile = r; // 最新の初回情報で更新
      map[key].firstRowNum = r['__rowNum'];
    }
    map[key].visits.push({
      type: 'first',
      date: r['希望日①'] || r['タイムスタンプ'],
      time: r['希望時間①'] || '',
      menu: r['メニュー'] || '',
      datetime1: r['希望日時①'] || '',
      datetime2: r['希望日時②'] || '',
      request: r['ご要望'] || '',
      key: key + '_' + r['タイムスタンプ'],
      rowNum: r['__rowNum'],
      photos: (r['施術写真'] || '').toString().split(',').filter(Boolean),
      memo: r['施術メモ'] || ''
    });
  });

  // リピーターデータを追加
  repeatDataRaw.forEach(function(r) {
    var owner = r['飼い主さまのお名前'] || r['飼い主様のお名前'];
    var dog = r['ワンちゃんのお名前'];
    var key = customerKey(owner, dog);
    if (!map[key]) {
      // 初回データが見つからない場合は新規顧客として作成（後で写真等のカラムも拾えるようrをそのまま保持）
      map[key] = {
        owner: owner, dog: dog,
        profile: r,
        visits: []
      };
    }
    map[key].visits.push({
      type: 'repeat',
      date: r['希望日①'] || r['タイムスタンプ'],
      time: r['希望時間①'] || '',
      menu: r['メニュー'] || '',
      datetime1: r['希望日時①'] || '',
      datetime2: r['希望日時②'] || '',
      lastTrim: r['前回の施術からの期間'] || '',
      request: r['ご要望'] || '',
      key: key + '_' + r['タイムスタンプ'],
      rowNum: r['__rowNum'],
      photos: (r['施術写真'] || '').toString().split(',').filter(Boolean),
      memo: r['施術メモ'] || ''
    });
  });

  // 来店履歴を日付順に並べる
  customers = Object.values(map).map(function(c) {
    c.visits.sort(function(a, b) { return new Date(a.date) - new Date(b.date); });
    c.visitCount = c.visits.length;
    c.lastVisit = c.visits[c.visits.length - 1];
    c.dogPhotoId = (c.profile['犬の写真'] || '').toString().trim();
    return c;
  });

  // 削除（非表示）にした顧客を除外
  customers = customers.filter(function(c) { return !hidden[customerKey(c.owner, c.dog)]; });

  // 今日の日付
  var todayStr = (function() {
    var d = new Date();
    var y = d.getFullYear();
    var m = ('0' + (d.getMonth()+1)).slice(-2);
    var day = ('0' + d.getDate()).slice(-2);
    return y + '-' + m + '-' + day;
  })();

  // 表示順：①今日の予約(時間順) ②未来の予約(近い日付順) ③過去のみ(最終来店が新しい順)
  function dateOnlyStr(dt) {
    var d = new Date(dt);
    if (isNaN(d)) return '';
    var y = d.getFullYear();
    var m = ('0' + (d.getMonth()+1)).slice(-2);
    var day = ('0' + d.getDate()).slice(-2);
    return y + '-' + m + '-' + day;
  }
  function category(c) {
    var ds = dateOnlyStr(c.lastVisit.date);
    if (!ds) return 2; // 日付不明は過去扱い（末尾に）
    if (ds === todayStr) return 0;
    if (ds > todayStr) return 1;
    return 2;
  }
  customers.sort(function(a, b) {
    var ca = category(a), cb = category(b);
    if (ca !== cb) return ca - cb;
    if (ca === 0) {
      // 今日→時間順
      return (a.lastVisit.time || '99:99').localeCompare(b.lastVisit.time || '99:99');
    }
    if (ca === 1) {
      // 未来→日付が近い順
      return new Date(a.lastVisit.date) - new Date(b.lastVisit.date);
    }
    // 過去のみ→最終来店が新しい順
    return new Date(b.lastVisit.date) - new Date(a.lastVisit.date);
  });
}

function formatDate(d) {
  if (!d) return '';
  var date = new Date(d);
  if (isNaN(date)) return d;
  return (date.getMonth()+1) + '/' + date.getDate();
}
function formatDateFull(d) {
  if (!d) return '';
  var date = new Date(d);
  if (isNaN(date)) return d;
  return date.getFullYear() + '/' + (date.getMonth()+1) + '/' + date.getDate() + ' ' + ('0'+date.getHours()).slice(-2) + ':' + ('0'+date.getMinutes()).slice(-2);
}

function setCalStatus(status) {
  var date = document.getElementById('statusDate').value;
  var endDate = calMode === 'range' ? document.getElementById('statusEndDate').value : '';
  if (!date) { alert('日付を選択してください'); return; }
  if (calMode === 'range' && !endDate) { alert('終了日を選択してください'); return; }
  if (calMode === 'range' && endDate < date) { alert('終了日は開始日より後を選択してください'); return; }

  var label = status === '解除'
    ? (calMode === 'range' ? date + ' 〜 ' + endDate + ' の設定を解除' : date + ' の設定を解除')
    : (calMode === 'range' ? date + ' 〜 ' + endDate + ' を「' + status + '」に設定' : date + ' を「' + status + '」に設定');
  if (!confirm(label + 'します。よろしいですか？')) return;

  var url = FIRST_API_URL + '?action=setStatus&secret=rinon2026&date=' + date;
  if (endDate) url += '&endDate=' + endDate;
  if (status === '解除') {
    var requests = [
      fetch(url + '&status=' + encodeURIComponent('満員') + '&remove=1'),
      fetch(url + '&status=' + encodeURIComponent('休業') + '&remove=1')
    ];
    Promise.all(requests).then(function() { alert('解除しました！'); }).catch(function() { alert('エラーが発生しました。'); });
  } else {
    fetch(url + '&status=' + encodeURIComponent(status))
      .then(function() { alert(label + 'しました！'); })
      .catch(function() { alert('エラーが発生しました。'); });
  }
}

function formatPhone(val) {
  if (!val) return '';
  var s = String(val).trim();
  var digits = s.replace(/[-‐−ー\s]/g, '');
  if (/^\d+$/.test(digits)) {
    // Googleスプレッドシートが数値として保存すると先頭の0が消えるため補完する
    // （携帯番号は11桁、一部の固定電話は10桁が正しい桁数）
    if (digits.charAt(0) !== '0' && (digits.length === 9 || digits.length === 10)) {
      digits = '0' + digits;
    }
    if (digits.length === 11) return digits.slice(0, 3) + '-' + digits.slice(3, 7) + '-' + digits.slice(7);
    if (digits.length === 10) return digits.slice(0, 2) + '-' + digits.slice(2, 6) + '-' + digits.slice(6);
    return digits;
  }
  return s;
}

function saveMemoNow(uid, el) {
  var info = visitLookup[uid];
  if (!info || !info.rowNum) return;
  var apiUrl = info.type === 'first' ? FIRST_API_URL : REPEAT_API_URL;
  var val = el.value;

  var params = new URLSearchParams();
  params.set('action', 'saveMemo');
  params.set('secret', DELETE_SECRET);
  params.set('row', info.rowNum);
  params.set('memo', val);
  fetch(apiUrl, { method: 'POST', body: params }).then(function(r) { return r.json(); }).then(function(res) {
    if (!res || !res.success) {
      el.style.borderColor = '#C06060';
      alert('メモの保存に失敗しました：' + (res && res.error ? res.error : '不明なエラー'));
      return;
    }
    info.visitObj.memo = val;
    el.style.borderColor = '#2EA87E';
    setTimeout(function() { el.style.borderColor = '#B3D9F5'; }, 1000);
  }).catch(function() {
    el.style.borderColor = '#C06060';
    alert('通信エラーが発生しました');
  });
}

  var c = customers[idx];
  if (!c) return;
  if (!confirm(c.owner + ' 様 / ' + c.dog + ' のカルテを削除します。\n\n※スプレッドシートの該当行もすべて削除されます。この操作は元に戻せません。\n\nよろしいですか？')) return;

  // スプレッドシートの行を削除（行番号が大きい順に削除して行ずれを防ぐ）
  var firstRows  = c.visits.filter(function(v) { return v.type === 'first';  }).map(function(v) { return v.rowNum; });
  var repeatRows = c.visits.filter(function(v) { return v.type === 'repeat'; }).map(function(v) { return v.rowNum; });

  // 降順に並べて上から順に削除すると行番号がずれないよう、大きい番号から削除
  firstRows.sort(function(a,b){return b-a;});
  repeatRows.sort(function(a,b){return b-a;});

  var promises = [];
  firstRows.forEach(function(row) {
    promises.push(fetch(FIRST_API_URL + '?action=deleteRow&row=' + row + '&secret=' + DELETE_SECRET));
  });
  repeatRows.forEach(function(row) {
    promises.push(fetch(REPEAT_API_URL + '?action=deleteRow&row=' + row + '&secret=' + DELETE_SECRET));
  });

  Promise.all(promises).then(function() {
    hideCustomerKey(customerKey(c.owner, c.dog));
    buildCustomers();
    renderList(customers);
    document.querySelector('.main').classList.remove('sidebar-collapsed');
    document.getElementById('content').innerHTML =
      '<div class="welcome">' +
        '<div class="welcome-icon">🐾</div>' +
        '<h2>カルテを選択してください</h2>' +
        '<p>左の顧客一覧から名前をクリックすると<br>カルテ詳細と来店履歴が表示されます</p>' +
      '</div>';
  }).catch(function(err) {
    alert('削除中にエラーが発生しました。スプレッドシートを直接確認してください。\n' + err);
  });
}

function showHiddenManager() {
  document.querySelectorAll('.customer-card').forEach(function(c) { c.classList.remove('active'); });
  var keys = Object.keys(hidden);
  var html = '<div class="karte-header"><div><div class="karte-title">削除したカルテ</div><div class="karte-date">' + keys.length + '件　|　復元すると一覧に戻ります</div></div></div>';
  if (keys.length === 0) {
    html += '<div class="section"><div style="text-align:center; color:#7AAAC0; padding:30px; font-size:13px;">削除したカルテはありません</div></div>';
  } else {
    html += '<div class="section">' + keys.map(function(k) {
      var parts = k.split('___');
      var owner = parts[0], dog = parts[1];
      return '<div style="display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid #E8F4FC; gap:8px;">' +
        '<span style="font-size:13px; color:#0C447C;">' + owner + ' 様 / ' + dog + '</span>' +
        '<span style="display:flex; gap:6px; flex-shrink:0;">' +
          '<button class="btn btn-primary btn-sm" onclick="restoreCustomer(\'' + k.replace(/'/g, "\\'") + '\')">復元</button>' +
          '<button class="btn btn-light btn-sm" style="color:#C06060;" onclick="purgeHidden(\'' + k.replace(/'/g, "\\'") + '\')">完全に削除</button>' +
        '</span>' +
      '</div>';
    }).join('') + '</div>';
  }
  document.getElementById('content').innerHTML = html;
}

function restoreCustomer(key) {
  unhideCustomerKey(key);
  buildCustomers();
  renderList(customers);
  showHiddenManager();
}

function purgeHidden(key) {
  if (!confirm('このリストから完全に削除します。\n\n※スプレッドシート側で該当データを削除済みであることを確認してください。スプレッドシートにまだデータが残っていると、次回の「データ更新」で一覧に再表示されます。\n\nよろしいですか？')) return;
  delete hidden[key];
  localStorage.setItem('rinon_hidden', JSON.stringify(hidden));
  showHiddenManager();
}

function exportExcel() {
  if (customers.length === 0) { alert('データがありません'); return; }

  var wb = XLSX.utils.book_new();
  var ws = {};
  var merges = [];
  var rowHeights = {};
  var currentRow = 0; // 0-indexed

  // スタイル定義
  var NAVY  = '0C447C';
  var BLUE  = '1A6FA8';
  var LBLUE = '5DBAEC';
  var PALE  = 'E8F4FC';
  var WHITE = 'FFFFFF';
  var VLIGHT = 'F0F8FF';
  var BORDER = 'B3D9F5';

  function thinBorder() {
    return {
      top: {style:'thin', color:{rgb:BORDER}},
      bottom: {style:'thin', color:{rgb:BORDER}},
      left: {style:'thin', color:{rgb:BORDER}},
      right: {style:'thin', color:{rgb:BORDER}}
    };
  }

  function setCell(r, c, value, style) {
    var addr = XLSX.utils.encode_cell({r: r, c: c});
    ws[addr] = { v: value, t: 's', s: style };
  }

  function titleStyle() {
    return { fill:{fgColor:{rgb:NAVY}}, font:{color:{rgb:WHITE}, bold:true, sz:13}, alignment:{horizontal:'left', vertical:'center'}, border: thinBorder() };
  }
  function labelStyle() {
    return { fill:{fgColor:{rgb:PALE}}, font:{color:{rgb:NAVY}, bold:true, sz:10}, alignment:{horizontal:'center', vertical:'center', wrapText:true}, border: thinBorder() };
  }
  function valueStyle() {
    return { fill:{fgColor:{rgb:WHITE}}, font:{sz:10}, alignment:{horizontal:'left', vertical:'center', wrapText:true}, border: thinBorder() };
  }
  function memoLabelStyle() {
    return { fill:{fgColor:{rgb:LBLUE}}, font:{color:{rgb:WHITE}, bold:true, sz:10}, alignment:{horizontal:'center', vertical:'center', wrapText:true}, border: thinBorder() };
  }
  function memoValueStyle() {
    return { fill:{fgColor:{rgb:VLIGHT}}, font:{sz:10}, alignment:{horizontal:'left', vertical:'center', wrapText:true}, border: thinBorder() };
  }
  function tableHeaderStyle() {
    return { fill:{fgColor:{rgb:BLUE}}, font:{color:{rgb:WHITE}, bold:true, sz:10}, alignment:{horizontal:'center', vertical:'center'}, border: thinBorder() };
  }
  function visitFirstStyle() {
    return { fill:{fgColor:{rgb:PALE}}, font:{color:{rgb:BLUE}, bold:true, sz:10}, alignment:{horizontal:'center', vertical:'center'}, border: thinBorder() };
  }
  function visitRepeatStyle() {
    return { fill:{fgColor:{rgb:'F0F8E8'}}, font:{color:{rgb:'5A9050'}, bold:true, sz:10}, alignment:{horizontal:'center', vertical:'center'}, border: thinBorder() };
  }
  function visitCellStyle() {
    return { fill:{fgColor:{rgb:WHITE}}, font:{sz:10}, alignment:{horizontal:'left', vertical:'center', wrapText:true}, border: thinBorder() };
  }

  customers.forEach(function(c, idx) {
    var p = c.profile;
    var medical = p['病歴・現在の治療（選択肢）必須 '] || p['病歴・現在の治療'] || 'なし';

    // タイトル行
    merges.push({ s: {r: currentRow, c: 0}, e: {r: currentRow, c: 5} });
    setCell(currentRow, 0, '🐾 カルテ No.' + (idx+1) + '　　' + c.owner + ' 様 / ' + c.dog + '　　（来店' + c.visitCount + '回）', titleStyle());
    for (var cc = 1; cc <= 5; cc++) setCell(currentRow, cc, '', titleStyle());
    rowHeights[currentRow] = 24;
    currentRow++;

    // 2列ペア情報
    var pairs = [
      ['飼い主名', p['飼い主さまのお名前'] || c.owner, '電話番号', formatPhone(p['電話番号'])],
      ['ワンちゃん名', c.dog, '犬種', p['犬種'] || ''],
      ['性別', p['性別'] || '', '生年月日', p['ワンちゃんの生年月日'] || p['生年月日'] || ''],
      ['毛の色', p['毛の色'] || '', '性格', p['家でのふだんの性格'] || ''],
      ['病歴・治療', medical, '', '']
    ];

    pairs.forEach(function(pair) {
      setCell(currentRow, 0, pair[0], labelStyle());
      setCell(currentRow, 1, pair[1], valueStyle());
      if (pair[2]) {
        setCell(currentRow, 2, pair[2], labelStyle());
        merges.push({ s: {r: currentRow, c: 3}, e: {r: currentRow, c: 5} });
        setCell(currentRow, 3, pair[3], valueStyle());
        setCell(currentRow, 4, '', valueStyle());
        setCell(currentRow, 5, '', valueStyle());
      } else {
        merges.push({ s: {r: currentRow, c: 1}, e: {r: currentRow, c: 5} });
        for (var cc = 2; cc <= 5; cc++) setCell(currentRow, cc, '', valueStyle());
      }
      rowHeights[currentRow] = 22;
      currentRow++;
    });

    // 来店履歴ヘッダー
    merges.push({ s: {r: currentRow, c: 0}, e: {r: currentRow, c: 5} });
    setCell(currentRow, 0, '来店履歴', tableHeaderStyle());
    for (var cc = 1; cc <= 5; cc++) setCell(currentRow, cc, '', tableHeaderStyle());
    rowHeights[currentRow] = 22;
    currentRow++;

    // 来店履歴テーブルヘッダー
    var tHeaders = ['日時', '種別', 'メニュー', '希望日時①', '希望日時②', '施術メモ'];
    tHeaders.forEach(function(h, ci) {
      setCell(currentRow, ci, h, labelStyle());
    });
    rowHeights[currentRow] = 22;
    currentRow++;

    // 来店データ
    c.visits.forEach(function(v) {
      var isFirst = v.type === 'first';
      setCell(currentRow, 0, formatDateFull(v.date), visitCellStyle());
      setCell(currentRow, 1, isFirst ? '初回' : 'リピート', isFirst ? visitFirstStyle() : visitRepeatStyle());
      setCell(currentRow, 2, v.menu || '', visitCellStyle());
      setCell(currentRow, 3, v.datetime1 || '', visitCellStyle());
      setCell(currentRow, 4, v.datetime2 || '', visitCellStyle());
      setCell(currentRow, 5, v.memo || '', memoValueStyle());
      rowHeights[currentRow] = 24;
      currentRow++;
    });

    // 余白行
    currentRow += 2;
  });

  // 範囲設定
  ws['!ref'] = XLSX.utils.encode_range({ s: {r:0, c:0}, e: {r: currentRow, c: 5} });
  ws['!merges'] = merges;
  ws['!cols'] = [{wch:16},{wch:18},{wch:14},{wch:14},{wch:14},{wch:28}];
  ws['!rows'] = [];
  for (var r = 0; r <= currentRow; r++) {
    ws['!rows'][r] = { hpx: rowHeights[r] || 18 };
  }

  XLSX.utils.book_append_sheet(wb, ws, 'カルテ一覧');
  XLSX.writeFile(wb, 'Rinon_カルテ_' + new Date().toISOString().slice(0,10) + '.xlsx', { cellStyles: true });
}

loadData();
</script>

      </div>
      <div style="flex:1;">
        <div class="info-label">終了時間</div>
        <input id="pr-endtime" type="time" class="memo-box" style="min-height:auto; padding:8px 12px;">
      </div>
    </div>

    <div id="pr-error" style="display:none; background:#FFF0F0; color:#C06060; font-size:12px; padding:8px 12px; border-radius:8px; margin-bottom:12px;"></div>

    <button class="btn btn-primary" style="width:100%;" onclick="submitPhoneReserve()">登録する</button>
  </div>
</div>
<script>
var prType = 'first';
function setPrType(type) {
  prType = type;
  document.getElementById('pr-type-first').className  = type === 'first'  ? 'btn btn-primary btn-sm' : 'btn btn-light btn-sm';
  document.getElementById('pr-type-repeat').className  = type === 'repeat' ? 'btn btn-primary btn-sm' : 'btn btn-light btn-sm';
  document.getElementById('pr-type-first').style.flex  = '1';
  document.getElementById('pr-type-repeat').style.flex = '1';
}

function prToggleMix() {
  var mixGroup = document.getElementById('pr-mix-group');
  if (document.getElementById('pr-breed').value === 'ミックス') {
    mixGroup.style.display = 'block';
  } else {
    mixGroup.style.display = 'none';
    document.getElementById('pr-mix-detail').value = '';
  }
}

function openPhoneReserve() {
  ['pr-owner','pr-phone','pr-email','pr-dog','pr-mix-detail','pr-request','pr-date','pr-time','pr-endtime'].forEach(function(id) {
    document.getElementById(id).value = '';
  });
  ['pr-breed','pr-weight','pr-color','pr-by','pr-bm','pr-bd','pr-gender','pr-personality','pr-menu','pr-last-trim'].forEach(function(id) {
    document.getElementById(id).selectedIndex = 0;
  });
  document.getElementById('pr-medical').value = '特になし';
  document.getElementById('pr-mix-group').style.display = 'none';
  document.getElementById('pr-error').style.display = 'none';
  setPrType('first');
  document.getElementById('phoneReserveOverlay').style.display = 'flex';
}

function closePhoneReserve() {
  document.getElementById('phoneReserveOverlay').style.display = 'none';
}

function submitPhoneReserve() {
  var owner   = document.getElementById('pr-owner').value.trim();
  var phone   = document.getElementById('pr-phone').value.trim();
  var email   = document.getElementById('pr-email').value.trim();
  var dog     = document.getElementById('pr-dog').value.trim();
  var breed   = document.getElementById('pr-breed').value;
  var weight  = document.getElementById('pr-weight').value;
  var mixDetail = document.getElementById('pr-mix-detail').value.trim();
  var color   = document.getElementById('pr-color').value;
  var by      = document.getElementById('pr-by').value;
  var bm      = document.getElementById('pr-bm').value;
  var bd      = document.getElementById('pr-bd').value;
  var birthday = (by && bm && bd) ? (by + '年' + bm + '月' + bd + '日') : '';
  var gender  = document.getElementById('pr-gender').value;
  var personality = document.getElementById('pr-personality').value;
  var medical = document.getElementById('pr-medical').value;
  var menu    = document.getElementById('pr-menu').value;
  var lastTrim = document.getElementById('pr-last-trim').value;
  var request = document.getElementById('pr-request').value.trim();
  var date    = document.getElementById('pr-date').value;
  var time    = document.getElementById('pr-time').value;
  var endTime = document.getElementById('pr-endtime').value;
  var err     = document.getElementById('pr-error');

  if (!owner || !dog || !date || !time) {
    err.textContent = '飼い主名・ワンちゃん名・日付・開始時間は必須です';
    err.style.display = 'block';
    return;
  }

  var apiUrl = prType === 'first' ? FIRST_API_URL : REPEAT_API_URL;
  var params = new URLSearchParams();
  params.set('action', 'phoneReserve');
  params.set('secret', DELETE_SECRET);
  params.set('owner', owner);
  params.set('dog', dog);
  params.set('breed', breed);
  params.set('weight', weight);
  params.set('mix_detail', mixDetail);
  params.set('color', color);
  params.set('birthday', birthday);
  params.set('gender', gender);
  params.set('personality', personality);
  params.set('medical', medical);
  params.set('menu', menu);
  params.set('last_trim', lastTrim);
  params.set('request', request);
  params.set('phone', phone);
  params.set('email', email);
  params.set('date', date);
  params.set('time', time);
  params.set('endTime', endTime);

  fetch(apiUrl + '?' + params.toString())
    .then(function(r) { return r.json(); })
    .then(function(res) {
      if (res.success) {
        alert('✅ 登録しました！スプレッドシートとGoogleカレンダーに反映されました。');
        closePhoneReserve();
        loadData();
      } else {
        err.textContent = 'エラー：' + (res.error || '登録に失敗しました');
        err.style.display = 'block';
      }
    })
    .catch(function() {
      err.textContent = '通信エラーが発生しました';
      err.style.display = 'block';
    });
}
</script>
</body>
</html>

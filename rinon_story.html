* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #F5FBFF; font-family: 'Zen Maru Gothic', sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
.header { width: 100%; background: white; border-bottom: 1px solid #E8F4FC; padding: 12px 20px; display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 100; }
.back-btn { background: none; border: 1px solid #B3D9F5; border-radius: 20px; padding: 6px 16px; font-size: 13px; color: #1A6FA8; cursor: pointer; font-family: inherit; }
.title { font-size: 14px; color: #0C447C; font-weight: 500; }
.story-wrap { width: 100%; max-width: 480px; padding: 20px 16px; flex: 1; display: flex; flex-direction: column; align-items: center; gap: 16px; }
.img-container { position: relative; width: 100%; border-radius: 16px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
.img-container img { width: 100%; display: block; }
.nav-btn { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,0.85); border: none; border-radius: 50%; width: 36px; height: 36px; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
.nav-btn.prev { left: 8px; }
.nav-btn.next { right: 8px; }
.dots { display: flex; gap: 7px; justify-content: center; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: #B3D9F5; transition: background 0.2s; cursor: pointer; }
.dot.active { background: #1A6FA8; }
.counter { font-size: 12px; color: #7AAAC0; }
</style>

var cur = 0;
function render() {
  document.getElementById('storyImg').src = imgs[cur];
  var dots = document.getElementById('dots');
  dots.innerHTML = imgs.map(function(_, i) {
    return '<div class="dot' + (i===cur?' active':'') + '" onclick="goto(' + i + ')"></div>';
  }).join('');
  document.getElementById('counter').textContent = (cur+1) + ' / ' + imgs.length;
}
function move(d) { cur = (cur+d+imgs.length)%imgs.length; render(); }
function goto(i) { cur = i; render(); }

// スワイプ対応
var tx = 0;
document.querySelector('.img-container').addEventListener('touchstart', function(e){ tx = e.touches[0].clientX; });
document.querySelector('.img-container').addEventListener('touchend', function(e){
  var diff = tx - e.changedTouches[0].clientX;
  if (Math.abs(diff) > 40) move(diff > 0 ? 1 : -1);
});

render();
</script>
